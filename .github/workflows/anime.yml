name: Generate Anime Contribution Graph

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_anime.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/anime.yml"

permissions:
  contents: write

concurrency:
  group: anime-contribution-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate animated SVGs from live contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          python generate_anime.py --user "${{ github.repository_owner }}" --lang en --output dist/anime-contribution.svg
          python generate_anime.py --user "${{ github.repository_owner }}" --lang zh --output dist/anime-contribution-zh.svg
          python generate_anime.py --user "${{ github.repository_owner }}" --lang ja --output dist/anime-contribution-ja.svg
          touch dist/.nojekyll

      - name: Publish generated SVGs to output branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add -A
          git commit -m "Update anime contribution graph"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
